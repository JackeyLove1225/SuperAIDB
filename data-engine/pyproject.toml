[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engine"
version = "0.1.0"
description = "SuperAIDB 数据引擎：MCP 能力面 + FastAPI 的数据处理与 Agent 服务"
requires-python = ">=3.12"
dependencies = [
    # ---- AI / Agent ----
    "langchain==1.3.13",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "openai==2.45.0",
    # ---- Web 服务 ----
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "langgraph-cli==0.4.31",
    # ---- 数据库 ----
    "chromadb==1.5.9",
    "PyMySQL==1.1.2",
    # ---- 文件解析 ----
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "PyMuPDF==1.26.7",
    "Pillow==12.0.0",
    "paddleocr==3.3.2",
    # 可选：OCR 功能，未安装时自动降级（pipeline/parsing.py 有兜底）
    "pytesseract==0.3.13",
    # ---- 配置 / 工具 ----
    "python-dotenv==1.2.1",
    # paddlex（paddleocr 依赖）硬性要求 PyYAML==6.0.2，勿升 6.0.3
    "PyYAML==6.0.2",
    # ---- 系统工具 ----
    "psutil==7.1.3",
    "pystray==0.19.5",
]

# 项目不是包结构（无 src 布局），仅用于声明元数据；
# 显式置空避免 setuptools 对扁平多目录自动发现报错。
[tool.setuptools]
py-modules = []
