name: quota_materials
business_name: 定额材料明细表
description: 存储每个定额项目下消耗的材料明细，包括材料名称、规格、消耗量等，与定额项目主表通过quota_code关联
columns:
- name: id
  type: INTEGER
  pk: true
  not_null: true
  business_name: 主键
- name: quota_item_id
  type: INTEGER
  business_name: 所属定额项目
- name: material_name
  type: TEXT
  business_name: 材料名称
- name: material_spec
  type: TEXT
  business_name: 材料规格
- name: unit
  type: TEXT
  business_name: 计量单位
- name: consumption_quantity
  type: FLOAT
  business_name: 消耗量
- name: unit_price
  type: FLOAT
  business_name: 材料单价
foreign_keys:
- columns:
  - quota_item_id
  references: quota_items
  ref_columns:
  - id
display:
  hide_columns:
  - id
  - quota_item_id
