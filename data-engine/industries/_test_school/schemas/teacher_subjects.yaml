name: teacher_subjects
business_name: 教师科目关联
description: 教师与科目的多对多关联表
columns:
- name: id
  type: INTEGER
  not_null: true
  is_pk: true
  autoincrement: true
  description: 主键
- name: teacher_id
  type: INTEGER
  not_null: true
  description: 教师ID
- name: subject_id
  type: INTEGER
  not_null: true
  description: 科目ID
- name: created_at
  type: DATETIME
  not_null: true
  description: 创建时间
foreign_keys:
- columns:
  - teacher_id
  references: teachers
  ref_columns:
  - id
- columns:
  - subject_id
  references: subjects
  ref_columns:
  - id
datasource: primary
