name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quick-regression:
    runs-on: windows-latest
    # quick = 29 个离线测试层（含加密边界/守护进程/权限/MCP/管理API面）。
    # 产品目标平台是 Windows：加密层（SQLCipher+keyring 凭据管理器）与 daemon
    # 进程拉起都是 Windows 行为，CI 必须同平台才算真回归。
    # 注：本项目测试是 run_all.py 分层脚本制（每层独立子进程隔离单例态），
    # 不是 pytest 同进程收集制——pytest 收集会把 29 层压进一个进程，
    # 单例/共享状态互相污染（实测红）。故 CI 唯一门槛 = run_all --quick。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run quick regression suite (29 层离线)
        # 离线层不调 AI（注入占位 key 过 settings 校验）；
        # DB_ENCRYPT 不设——默认 true，加密层在 Windows 凭据管理器上真实跑
        # PYTHONUTF8：Windows runner 默认 GBK/charmap，run_all 打印的 ⚡ 等字符
        # 会直接 UnicodeEncodeError（实测事故）
        env:
          AI_API_KEY: dummy-key-for-offline-ci
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python tests/run_all.py --quick
