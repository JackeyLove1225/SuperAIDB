# 3.1 规划层确定性短路·规则词表
# 单一事实源：agent/open_layer/shortcircuit.py（产品）与
# scripts/stats_shortcircuit.py（命中率模拟器）共用本文件，禁止双写词表。
#
# 语义说明（改动即改变短路命中率，改前先跑模拟器验证）：
# - object_rules：对象关键词 → db_category_key，顺序即优先级（越具体越靠前）。
#   "列"不收（与"列出"冲突）；"表格"不收（"表格X的数据"是记录级，歧义大）。
# - constraint_rules：约束关键词（仅在 增×记录 时消费，如 批量→batch_insert_data）。
# - head_verb_rules：句首单字动词（^锚定，规避"加快/加重"误命中；
#   多字行为词由 agent/router.py _BEHAVIOR_KEYWORDS 生产词表覆盖，此处只补单字）。

object_rules:
  选择集: ["选择集", "暂存"]
  关联: ["关联", "联查", "联合查询"]
  统计: ["统计", "平均", "求和", "最大值", "最小值", "分组", "多少条", "几条", "计数", "总数"]
  数据库: ["数据库"]
  字段: ["字段"]
  索引: ["索引"]
  外键: ["外键"]
  模板: ["模板"]
  文件: ["文件", "文档"]
  记录: ["记录", "数据", "行"]

constraint_rules:
  批量: ["批量", "多条"]

head_verb_rules:
  查: ["查"]
  增: ["加"]
  删: ["删"]
  改: ["改"]
