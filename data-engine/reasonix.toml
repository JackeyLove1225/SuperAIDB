# ── data-engine 项目级 Reasonix 配置（20260809）──
# 本文件随 data-engine 仓库分发：别人 clone 后 cd data-engine 启动
# Reasonix，此配置自动加载（优先级 flag > ./reasonix.toml > 全局）。
# 路径均相对 data-engine/ 目录（Reasonix 以启动目录为项目根）。

# ── 权限模型边界：禁止上层 AI 直接写数据文件/权限配置 ──
# 数据访问必须走 MCP 通道（受 MCP_ROLE + permissions.yml 约束），
# 防 Bash 绕过应用层权限（改 permissions.yml / 直连 db 文件）。
# 语法：deny > ask > allow，显式 Deny 在任何模式（含 YOLO）下不可绕过。
# 本文件自身也入 deny：AI 不可改权限规则，调整权限只能由用户手动编辑。
[permissions]
deny = [
  "Edit(*reasonix.toml*)",
  "Write(*reasonix.toml*)",
  "Edit(*config/permissions.yml*)",
  "Write(*config/permissions.yml*)",
  "Edit(*db/*)",
  "Write(*db/*)",
  "Bash(*reasonix.toml*)",
  "Bash(*config/permissions.yml*)",
  "Bash(*db/*)",
  "Bash(python*data_engine.db*)",
  "Bash(sqlite3*data_engine.db*)",
]

# 人审模型（20260905 结构化契约）：写/DDL 具体工具不在 MCP 面——
# 一切数据操作经 execute_structured（结构化契约：枚举校验→树路由→args 适配，
# 上层 AI 只发结构化指令不转述自然语言），高危操作由通道内高危/force 闸
# 挂起到管理端审批中心结算（token 不出 AI 通道）。
# 客户端侧 ask 清单已无对象（具体工具不可见），故整段移除——
# 人审纵深收束为管理端审批中心单点（防双卡不一致）。

# ── data-engine MCP 插件（形态①：原生 Reasonix 作为上层 AI）──
# data-engine 全部数据能力经 MCP stdio 暴露为 mcp__data-engine__* 工具。
# 高危人审：MCP 进程内高危闸挂起表 token → 管理端审批中心结算
#（收口单点，fail-closed）。客户端侧 ask 卡是可叠加的第二层（可选）——
# 本仓示例未配，需要时在客户端配置里自行添加（对象仅限面上机制工具）。
# MCP_USER：MCP 通道身份绑定（users 表中存在的用户名）——未配置或用户
# 不存在则拒绝启动（fail-closed，未绑定连只读都不给）；角色与权限随所绑
# 用户（admin 全权限 / 普通用户按 permissions.yml）。
[[plugins]]
name = "data-engine"
command = "python"
args = ["mcp_server.py"]
env = { MCP_USER = "admin" }
